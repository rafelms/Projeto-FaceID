{% extends 'base.html' %}

{% block content %}
<div class="card shadow p-5 mx-auto" style="max-width: 400px; margin-top: 5rem;">
    <div class="text-center mb-4">
        <i class="bi bi-shield-lock" style="font-size: 3rem; color: #6366f1;"></i>
        <h2 class="mt-3">Acesso Admin</h2>
        <p class="text-muted">Entre com suas credenciais</p>
    </div>
    
    {% if error %}
    <div class="alert alert-danger" role="alert">
        {{ error }}
    </div>
    {% endif %}
    
    <form method="POST">
        <div class="mb-3">
            <label for="username" class="form-label">Usuário</label>
            <input type="text" class="form-control" id="username" name="username" required autofocus>
        </div>
        
        <div class="mb-4">
            <label for="password" class="form-label">Senha</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        
        <button type="submit" class="btn btn-primary w-100 mb-3">Entrar</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary w-100">Voltar</a>
    </form>
    
    <hr class="my-4">
    <p class="text-muted text-center small">
        Credenciais padrão:<br>
        Usuário: <strong>admin</strong><br>
        Senha: <strong>1234</strong>
    </p>
</div>
{% endblock %}
