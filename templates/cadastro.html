{% extends 'base.html' %}

{% block content %}
<div class="card shadow p-4 mx-auto" style="max-width: 600px;">
    <h2 class="text-center mb-4">Cadastro de Pessoas</h2>
    
    <form action="/cadastro" method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome Completo</label>
            <input type="text" class="form-control" id="nome" name="nome" required>
        </div>
        
        <div class="mb-3">
            <label for="cpf" class="form-label">CPF</label>
            <input type="text" class="form-control" id="cpf" name="cpf" required>
        </div>
        
        <div class="mb-3">
            <label for="foto" class="form-label">Foto Facial (Upload)</label>
            <input class="form-control" type="file" id="foto" name="foto" accept="image/*" required>
        </div>
        
        <button type="submit" class="btn btn-primary w-100" >Salvar Cadastro</button>
        <hr>
        <a href="{{ url_for('index') }}" class="btn btn-secondary w-100" >Voltar ao Início</a>
    </form>
</div>
{% endblock %}
