<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FaceID Security</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container-fluid px-3 px-md-4">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-shield-lock"></i>
                <span class="d-none d-sm-inline ms-2">FaceID Security</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="bi bi-house"></i>
                            <span class="d-lg-inline d-none ms-2">Início</span>
                        </a>
                    </li>
                    {% if session.get('admin_logged_in') %}
                    <li class="nav-item">
                        <a class="nav-link" href="/cadastro">
                            <i class="bi bi-person-plus"></i>
                            <span class="d-lg-inline d-none ms-2">Cadastro</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pessoas">
                            <i class="bi bi-people"></i>
                            <span class="d-lg-inline d-none ms-2">Lista</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/logout">
                            <i class="bi bi-box-arrow-right"></i>
                            <span class="d-lg-inline d-none ms-2">Sair</span>
                        </a>
                    </li>
                    {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/login">
                            <i class="bi bi-shield-lock"></i>
                            <span class="d-lg-inline d-none ms-2">Admin</span>
                        </a>
                    </li>
                    {% endif %}
                    <li class="nav-item">
                        <a class="nav-link" href="/reconhecer">
                            <i class="bi bi-image"></i>
                            <span class="d-lg-inline d-none ms-2">Foto</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/webcam">
                            <i class="bi bi-camera-video"></i>
                            <span class="d-lg-inline d-none ms-2">Webcam</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="py-4 py-md-5">
        <div class="container-fluid px-3 px-sm-4 px-md-5">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Theme Toggle Button -->
    <button class="theme-toggle" id="themeToggle" title="Alternar tema" aria-label="Alternar tema">
        <i class="bi bi-moon-stars"></i>
    </button>

    <!-- Footer -->
    <footer class="border-top mt-5 py-4">
        <div class="container-fluid px-3 px-md-4">
            <div class="row">
                <div class="col-12 col-md-8">
                    <p class="text-muted mb-0 small">
                        &copy; 2026 FaceID Security. Todos os direitos reservados.
                    </p>
                </div>
                <div class="col-12 col-md-4 text-md-end mt-3 mt-md-0">
                    <a href="#" class="text-muted text-decoration-none small me-3">Privacidade</a>
                    <a href="#" class="text-muted text-decoration-none small">Termos</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Initialize Theme on Page Load
        (function() {
            const body = document.body;
            const themeToggle = document.getElementById('themeToggle');
            
            // Load saved theme preference or default to DARK mode
            const savedTheme = localStorage.getItem('theme') || 'dark';
            
            // Apply saved theme immediately to prevent flash
            if (savedTheme === 'dark') {
                body.classList.add('dark-mode');
                if (themeToggle) {
                    themeToggle.innerHTML = '<i class="bi bi-sun"></i>';
                }
            }
        })();

        // Theme Toggle Script
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('themeToggle');
            const body = document.body;

            if (!themeToggle) {
                console.error('Theme toggle button not found');
                return;
            }

            // Toggle theme on button click
            themeToggle.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                // Toggle the dark-mode class
                body.classList.toggle('dark-mode');
                
                // Determine current theme
                const isDarkMode = body.classList.contains('dark-mode');
                const theme = isDarkMode ? 'dark' : 'light';
                
                // Save preference
                localStorage.setItem('theme', theme);
                
                // Update icon with smooth transition
                if (isDarkMode) {
                    themeToggle.innerHTML = '<i class="bi bi-sun"></i>';
                } else {
                    themeToggle.innerHTML = '<i class="bi bi-moon-stars"></i>';
                }
                
                // Add animation
                themeToggle.style.transform = 'rotate(180deg)';
                setTimeout(() => {
                    themeToggle.style.transform = 'rotate(0deg)';
                }, 300);
            });

            // Close mobile menu when clicking a nav link
            const navLinks = document.querySelectorAll('.navbar-nav .nav-link');
            const navbarCollapse = document.querySelector('.navbar-collapse');
            const navbarToggler = document.querySelector('.navbar-toggler');

            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    if (navbarCollapse && navbarCollapse.classList.contains('show')) {
                        navbarToggler.click();
                    }
                });
            });
        });
    </script>
</body>
</html>
