{% extends 'base.html' %}

{% block content %}
<div class="card shadow p-4 mx-auto">
    <h2 class="text-center mb-4">Pessoas Cadastradas</h2>
    
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Data de Cadastro</th>
                    <th class="text-center">Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for pessoa in pessoas %}
                <tr>
                    <td>{{ pessoa[0] }}</td>
                    <td>{{ pessoa[1] }}</td>
                    <td>{{ pessoa[2] }}</td>
                    <td>{{ pessoa[3] }}</td>
                    <td class="text-center">
                        <form action="{{ url_for('excluir_pessoa', id=pessoa[0]) }}" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-outline-danger btn-sm" 
                                    onclick="return confirm('Tem certeza que deseja excluir {{ pessoa[1] }}? Esta ação apagará os dados e a foto permanentemente.')">
                                <i class="bi bi-trash"></i> Excluir
                            </button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" class="text-center text-muted py-4">Nenhuma pessoa cadastrada ainda.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="text-center mt-3">
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Voltar ao Início</a>
    </div>
</div>
{% endblock %}
